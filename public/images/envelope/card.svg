<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="">
  <defs>
    <radialGradient id="lamp" cx="18%" cy="0%" r="70%">
      <stop offset="0" stop-color="#f1b860" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f1b860" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13202f"/>
      <stop offset="1" stop-color="#0b111b"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1c2230" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="url(#night)"/>
  <rect width="640" height="400" fill="url(#lamp)"/>
  <g stroke="#c9d4e0" stroke-opacity="0.07">
    <path d="M40 0 10 400M140 0 110 400M240 0 210 400M340 0 310 400M440 0 410 400M540 0 510 400M640 0 610 400"/>
  </g>
  <!-- The map -->
  <g transform="translate(120 70) rotate(-4)">
    <rect width="400" height="270" fill="#f5eedf"/>
    <rect width="400" height="270" fill="url(#grid)"/>
    <path d="M200 0V270M0 135H400" stroke="#1c2230" stroke-opacity="0.12"/>
    <!-- river -->
    <path d="M-2 190C60 170 90 210 150 196S250 140 300 150 370 120 402 128" fill="none" stroke="#8fcac1" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
    <!-- streets -->
    <g fill="none" stroke="#1c2230" stroke-opacity="0.55" stroke-width="2">
      <path d="M60 40 120 90 110 150M120 90 200 80 260 110M200 80 190 30M260 110 250 165M150 120 230 130"/>
      <path d="M160 60c10 20 40 25 55 10"/>
    </g>
    <!-- railway off the edge -->
    <path d="M230 230 330 210 402 205" fill="none" stroke="#1c2230" stroke-width="3"/>
    <path d="M240 222v14M260 218v14M280 214v14M300 211v14M320 208v14M340 206v14M360 205v14M380 204v14" stroke="#1c2230" stroke-width="2"/>
    <!-- marks -->
    <g fill="none" stroke="#9a3b28" stroke-width="3.5" stroke-linecap="round">
      <circle cx="130" cy="95" r="11"/><path d="M122 103 138 87"/>
      <circle cx="300" cy="148" r="11"/><path d="M292 156 308 140"/>
      <circle cx="370" cy="200" r="11"/><path d="M362 208 378 192"/>
    </g>
  </g>
  <!-- The key -->
  <g transform="translate(430 270) rotate(28)">
    <circle r="22" fill="none" stroke="#f1b860" stroke-width="8"/>
    <path d="M22 0H110M88 0v16M102 0v12" stroke="#f1b860" stroke-width="8" stroke-linecap="round"/>
    <path d="M-10 26l-8 34h30z" fill="#f5eedf" transform="rotate(-28)"/>
